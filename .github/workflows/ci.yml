name: DevOps Monitor CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Se connecter a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier Backend
        uses: docker/build-push-action@v6
        with:
          context: ./application/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/devops-monitor-backend:latest

      - name: Construire et publier Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./application/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/devops-monitor-frontend:latestgit